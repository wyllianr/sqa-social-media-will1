name: CI - Testes Automatizados

on:
  pull_request:
    branches:
      - main

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Testes da API (caixa-branca)
        run: |
          chmod +x mvnw
          ./mvnw test
        working-directory: ./api

      - name: Instalar dependências do client
        run: npm ci
        working-directory: ./client

      - name: Testes do client (caixa-branca)
        run: npm test -- --watchAll=false
        working-directory: ./client

      - name: Instalar dependências dos testes E2E e API
        run: npm ci
        working-directory: ./tests

      - name: Instalar browsers do Playwright
        run: npx playwright install --with-deps chromium
        working-directory: ./tests

      - name: Iniciar a API em background
        run: |
          chmod +x mvnw
          ./mvnw spring-boot:run \
            -Dspring-boot.run.jvmArguments="-Dspring.datasource.url=jdbc:h2:mem:testdb -Dspring.datasource.driverClassName=org.h2.Driver -Dspring.datasource.username=sa -Dspring.datasource.password= -Dspring.jpa.database-platform=org.hibernate.dialect.H2Dialect -Dspring.jpa.hibernate.ddl-auto=create-drop" &
        working-directory: ./api

      - name: Build do client
        run: npm run build
        working-directory: ./client

      - name: Iniciar o client em background
        run: npm start &
        working-directory: ./client

      - name: Aguardar API e client ficarem prontos
        run: |
          npx wait-on http://localhost:8080/auth/signin --timeout 90000 || true
          npx wait-on http://localhost:3000 --timeout 60000
        working-directory: ./tests

      - name: Rodar testes E2E e de API (Playwright)
        run: npm test
        working-directory: ./tests
